<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>dz-gram</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;padding:20px;}
header{text-align:center;padding:12px;font-weight:bold;font-size:20px;background:#fff;border-bottom:1px solid #ddd;}
.container{max-width:500px;margin:auto;}
.box{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;}
input,button{width:100%;padding:10px;margin:6px 0;}
button{background:#0095f6;color:#fff;border:none;cursor:pointer;}
button:hover{background:#0073e6;}
.toggle{cursor:pointer;font-size:13px;color:#0095f6;}
.post{margin-bottom:15px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 0 5px rgba(0,0,0,0.05);}
.post img{width:100%;}
.actions{padding:10px;font-size:20px;display:flex;justify-content:space-around;}
</style>
</head>
<body>

<header>📸 dz-gram</header>

<div class="container" id="auth">

  <div class="box">
    <h2>إنشاء حساب</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
    <span class="toggle" onclick="togglePassword()">👁️ إظهار / إخفاء كلمة المرور</span>
    <button onclick="registerEmail()">تسجيل بالبريد</button>
  </div>

  <div class="box">
    <h2>تسجيل برقم الهاتف</h2>
    <input type="tel" id="phone" placeholder="+213XXXXXXXXX">
    <div id="recaptcha-container"></div>
    <button onclick="sendCode()">إرسال الرمز</button>
    <input type="text" id="smsCode" placeholder="رمز SMS">
    <button onclick="verifyCode()">تأكيد الرمز</button>
  </div>

  <div class="box">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="loginPassword" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
  </div>

</div>

<div class="container" id="feed" style="display:none;">
  <h3>Feed</h3>

  <div class="box">
    <h3>رفع صورة جديدة</h3>
    <input type="file" id="postImage">
    <button id="uploadBtn">رفع الصورة</button>
    <p id="uploadMessage" style="color:green;"></p>
  </div>

  <div id="postsContainer"></div>

</div>

<script type="module" src="firebase.js"></script>
</body>
</html>
