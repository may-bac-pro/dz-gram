<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>dz-gram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {margin:0; font-family: Arial, sans-serif; background: #fafafa;}
    header {background:#fff; border-bottom:1px solid #ddd; padding:12px; text-align:center; font-weight:bold; font-size:20px;}
    .container {max-width: 500px; margin:auto; padding: 20px;}
    .card {background:#fff; padding:20px; margin-bottom:15px; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1);}
    input {width:100%; padding:10px; margin:5px 0; border-radius:4px; border:1px solid #ccc;}
    button {width:100%; padding:10px; margin-top:10px; border:none; background:#0095f6; color:white; font-weight:bold; border-radius:4px; cursor:pointer;}
    button:hover {background:#0073e6;}
    #feed {display:none;}
    .post {margin-bottom:15px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 0 5px rgba(0,0,0,0.05);}
    .post img {width:100%;}
    .actions {padding:10px; font-size:20px; display:flex; justify-content:space-around;}
  </style>
</head>
<body>

<header>📸 dz-gram</header>

<div class="container" id="auth">

  <div class="card">
    <h3>Sign Up</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone number (+213...)">
    <input type="password" id="password" placeholder="Password">
    <button id="signupBtn">Sign Up</button>
    <p id="signupMessage" style="color:green;"></p>
  </div>

  <div class="card">
    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="text" id="loginPhone" placeholder="Phone number (+213...)">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="loginMessage" style="color:green;"></p>
  </div>

</div>

<div class="container" id="feed">
  <h3>Feed</h3>
  <div class="post">
    <img src="https://via.placeholder.com/500x350" alt="post">
    <div class="actions">❤️ 💬 🔄</div>
  </div>
  <div class="post">
    <img src="https://via.placeholder.com/500x350" alt="post">
    <div class="actions">❤️ 💬 🔄</div>
  </div>
</div>

<script type="module" src="firebase.js"></script>
</body>
</html>
