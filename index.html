<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>dz-gram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }
    .feed {
      max-width: 500px;
      margin: auto;
    }
    .post {
      background: #fff;
      margin: 15px 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
    .post img {
      width: 100%;
    }
    .actions {
      padding: 10px;
      font-size: 20px;
      display: flex;
      justify-content: space-around;
    }
  </style>
</head>
<body>

<header>📸 dz-gram</header>

<div class="feed">
  <div class="post">
    <img src="https://via.placeholder.com/500x350" alt="post">
    <div class="actions">❤️ 💬 🔄</div>
  </div>

  <div class="post">
    <img src="https://via.placeholder.com/500x350" alt="post">
    <div class="actions">❤️ 💬 🔄</div>
  </div>
</div>

</body>
  </html>
